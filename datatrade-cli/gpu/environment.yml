name: datatrade-gpu
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch>=2.2.0
  - pytorch-cuda=12.1
  - faiss-gpu
  - numpy>=1.26
  - pillow>=10
  - pip
  - pip:
    - transformers>=4.40.0
    - accelerate>=0.28.0
    - sentencepiece
    - FlagEmbedding>=1.2.9
    - surya-ocr>=0.6.0
    - pdf2image>=1.17.0
    - PyMuPDF>=1.24.0
    - playwright>=1.44.0
    - rich>=13.7.0
    - typer>=0.12.0
